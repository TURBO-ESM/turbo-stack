# Producer: build the turbo-stack CI base images and push them to GHCR.
#
# One image per flavor, named <compiler>-<mpi> (the FLAVORS list in the `select`
# job), all from docker/Dockerfile.turbo-ci. A flavor is added by adding an entry
# to that list, an option to `inputs.flavor`, and a case in
# docker/install_compiler.sh.
#
# Each flavor is built for linux/amd64 and linux/arm64 (the ARCHES list) and
# published as one multi-arch tag, so `docker pull` and a job's `container:` get
# the build for their own machine; arm64 is what an Apple Silicon Mac runs. Each
# architecture builds natively on a runner of its own and pushes by digest, and
# the `publish` job then puts the flavor's tags on the pair. Not one
# `platforms: linux/amd64,linux/arm64` build: buildx would emulate arm64 with
# QEMU, and the ~1 h from-source Spack build would take many times that.
#
# The image bakes the repo's own Spack environment (spack/spack.yaml, env name
# "turbo_stack") so that CI does not rebuild Tier-1/Tier-1.5 dependencies
# (cmake, openmpi, netcdf, parallelio, pfunit, amrex) on every run. It is
# consumed by .github/workflows/turbo-cmake-container-tests.yaml.
#
# This build is expensive -- ~1 hour per image, because Spack compiles the
# dependency stack from source -- so it is manual only: no push or pull_request
# trigger. A merge should never block on an image rebuild. Layer caching (a GHCR
# registry cache tag per flavor and architecture,
# turbo-ci:buildcache-<flavor>-<arch>) keeps incremental rebuilds cheap.
#
# Rebuild after changing a generator input (spack/spack.yaml,
# spack/create_spack_environment.sh, docker/Dockerfile.turbo-ci,
# docker/install_compiler.sh): Actions ->
# "Build turbo-stack CI container" -> Run workflow, or
#     gh workflow run build-turbo-ci-container.yaml                      # every flavor
#     gh workflow run build-turbo-ci-container.yaml -f flavor=llvm-openmpi  # one
#
# To validate a recipe change BEFORE merging it, dispatch against your branch --
# the run uses that branch's Dockerfile and spack.yaml:
#     gh workflow run build-turbo-ci-container.yaml --ref <your-branch>
# That is safe: the mutable `<flavor>` tag the consumer pulls is only published
# from the default branch (see the tag list below), so a branch build cannot hand
# the team an unvalidated image.
#
# Deferred on purpose: a weekly `schedule` to pick up base-image/CVE updates.
name: Build turbo-stack CI container

on:
  workflow_dispatch:
    inputs:
      flavor:
        description: Which image to build -- one flavor, or all of them.
        type: choice
        default: all
        options:
          - all
          - gcc-openmpi
          - llvm-openmpi

permissions:
  contents: read
  packages: write

env:
  # Single source of truth for the image ref. Spelled out literally rather than
  # derived from ${{ github.repository }}, which is TURBO-ESM/turbo-stack --
  # GHCR requires an all-lowercase path. The consumer (cmake-build.yaml) repeats
  # this literal because the `env` context is not available in
  # `jobs.<job_id>.container.image`; keep the two in sync.
  IMAGE: ghcr.io/turbo-esm/turbo-stack/turbo-ci

jobs:
  # Picks the flavors to build and pairs each with every architecture. A job of
  # its own because a static matrix cannot be filtered by an input: `matrix` is
  # not available in a job-level `if`, and a matrix `include` entry that matches
  # nothing adds a combination rather than dropping one.
  select:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      flavors: ${{ steps.pick.outputs.flavors }}
      builds: ${{ steps.pick.outputs.builds }}
      arches: ${{ steps.pick.outputs.arches }}
    steps:
      - name: Pick flavors
        id: pick
        env:
          WANT: ${{ inputs.flavor }}
          # Every flavor this workflow builds.
          #   flavor:           the image tag, <compiler>-<mpi>
          #   compiler/version: the arguments to docker/install_compiler.sh
          FLAVORS: |
            [
              {"flavor": "gcc-openmpi",  "compiler": "gcc",  "compiler_version": ""},
              {"flavor": "llvm-openmpi", "compiler": "llvm", "compiler_version": "21"}
            ]
          # Every architecture each flavor is built for, and the hosted runner
          # that builds it natively. Arm runners have no -latest label;
          # ubuntu-26.04-arm is the release ubuntu-latest runs today.
          ARCHES: |
            [
              {"arch": "amd64", "runner": "ubuntu-latest"},
              {"arch": "arm64", "runner": "ubuntu-26.04-arm"}
            ]
        run: |
          picked=$(jq -c --arg want "$WANT" \
              '[.[] | select($want == "all" or .flavor == $want)]' <<< "$FLAVORS")
          if [[ "$picked" == "[]" ]]; then
              echo "::error::unknown flavor '$WANT'"
              exit 1
          fi
          {
              echo "flavors=$picked"
              # One build per (flavor, architecture) pair.
              echo "builds=$(jq -c --argjson arches "$ARCHES" \
                  '[.[] as $f | $arches[] | $f + .]' <<< "$picked")"
              echo "arches=$(jq -c '[.[].arch]' <<< "$ARCHES")"
          } >> "$GITHUB_OUTPUT"

  build:
    name: build (${{ matrix.flavor }}, ${{ matrix.arch }})
    needs: select
    runs-on: ${{ matrix.runner }}
    # A full from-source Spack build is ~1 h; anything past 3 h means a hung
    # fetch or compile, so fail rather than burn the 6 h default.
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.select.outputs.builds) }}
    # One build per flavor and architecture at a time: two concurrent dispatches
    # would both export mode=max to the same cache tag. Queue instead of cancel:
    # a nearly-finished 1 h build should not be thrown away by a second dispatch.
    # Different flavors and architectures share nothing, so they do not wait on
    # each other.
    concurrency:
      group: turbo-ci-image-${{ matrix.flavor }}-${{ matrix.arch }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        # No submodules: the image build only needs spack/ and docker/ (see
        # .dockerignore).

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Labels only. Tags go on in the publish job, onto both architectures at
      # once, so no tag ever names one architecture's image alone.
      - name: Compute image labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.turbo-ci
          # Native: the runner is this architecture. The Dockerfile reads it
          # (TARGETARCH) to pick the Spack target.
          platforms: linux/${{ matrix.arch }}
          tags: ${{ env.IMAGE }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          build-args: |
            COMPILER=${{ matrix.compiler }}
            COMPILER_VERSION=${{ matrix.compiler_version }}
          # Registry-backed layer cache stored as a :buildcache-<flavor>-<arch>
          # tag in GHCR -- one per flavor and architecture, because a mode=max
          # export replaces the whole cache tag, so builds sharing one would evict
          # each other. The GitHub Actions cache backend (type=gha) returns
          # `not_found` on export here and aborts the in-flight image push, so it
          # is unusable.
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache-${{ matrix.flavor }}-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache-${{ matrix.flavor }}-${{ matrix.arch }},mode=max

      # How the publish job finds this run's build: an artifact per build,
      # holding an empty file named after the pushed digest.
      - name: Export the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - name: Upload the digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.flavor }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1
          # A re-run of this job replaces the earlier attempt's digest.
          overwrite: true

  # Tags each flavor's builds as one multi-arch image. Runs even when a build
  # failed, so one flavor's failure does not hold back another's. A flavor
  # missing an architecture from THIS run publishes nothing: its tags keep
  # pointing at the previous image, rather than at a new image for one
  # architecture and an old one for the other.
  publish:
    name: publish (${{ matrix.flavor }})
    needs: [select, build]
    if: ${{ !cancelled() && needs.select.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.select.outputs.flavors) }}
    # Two dispatches must not interleave their tag pushes for one flavor.
    concurrency:
      group: turbo-ci-image-${{ matrix.flavor }}
      cancel-in-progress: false
    steps:
      - name: Collect this run's builds
        uses: actions/download-artifact@v8
        with:
          pattern: digests-${{ matrix.flavor }}-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          # `<flavor>` (e.g. gcc-openmpi) is the mutable tag the consumer pulls.
          # It is published ONLY from the default branch, so dispatching this
          # workflow against a feature branch validates the recipe (the
          # expensive, likely-to-fail part) without handing the team an
          # unvalidated image.
          # The sha-suffixed tag is always published: it is the immutable ref to
          # point the consumer at when bisecting an image regression.
          tags: |
            type=raw,value=${{ matrix.flavor }},enable={{is_default_branch}}
            type=sha,prefix=${{ matrix.flavor }}-,format=short

      # download-artifact succeeds even when the pattern matches nothing, so
      # count: every architecture must have built in this run.
      - name: Publish the multi-arch image
        env:
          FLAVOR: ${{ matrix.flavor }}
          ARCHES: ${{ needs.select.outputs.arches }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          shopt -s nullglob
          digests=("$RUNNER_TEMP"/digests/*)
          want=$(jq length <<< "$ARCHES")
          if (( ${#digests[@]} != want )); then
              echo "::error::$FLAVOR: ${#digests[@]} of $want architectures built in this run; publishing nothing"
              exit 1
          fi
          args=()
          while read -r tag; do
              [[ -n "$tag" ]] && args+=(-t "$tag")
          done <<< "$TAGS"
          for d in "${digests[@]}"; do
              args+=("$IMAGE@sha256:${d##*/}")
          done
          docker buildx imagetools create "${args[@]}"

      - name: Show what was published
        env:
          REF: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
        run: docker buildx imagetools inspect "$REF"
