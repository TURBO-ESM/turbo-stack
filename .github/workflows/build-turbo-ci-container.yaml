# Producer: build the turbo-stack CI base images and push them to GHCR.
#
# One image per flavor, named <compiler>-<mpi> (the FLAVORS list in the `select`
# job), all from docker/Dockerfile.turbo-ci. A flavor is added by adding an entry
# to that list, an option to `inputs.flavor`, and a case in
# docker/install_compiler.sh.
#
# The image bakes the repo's own Spack environment (spack/spack.yaml, env name
# "turbo_stack") so that CI does not rebuild Tier-1/Tier-1.5 dependencies
# (cmake, openmpi, netcdf, parallelio, pfunit, amrex) on every run. It is
# consumed by .github/workflows/turbo-cmake-container-tests.yaml.
#
# This build is expensive -- ~1 hour, because Spack compiles the dependency stack
# from source -- so it is manual only: no push or pull_request trigger. A merge
# should never block on an image rebuild. Layer caching (a GHCR registry cache
# tag per flavor, turbo-ci:buildcache-<flavor>) keeps incremental rebuilds cheap.
#
# Rebuild after changing a generator input (spack/spack.yaml,
# spack/create_spack_environment.sh, docker/Dockerfile.turbo-ci,
# docker/install_compiler.sh): Actions ->
# "Build turbo-stack CI container" -> Run workflow, or
#     gh workflow run build-turbo-ci-container.yaml                      # every flavor
#     gh workflow run build-turbo-ci-container.yaml -f flavor=llvm-openmpi  # one
#
# To validate a recipe change BEFORE merging it, dispatch against your branch --
# the run uses that branch's Dockerfile and spack.yaml:
#     gh workflow run build-turbo-ci-container.yaml --ref <your-branch>
# That is safe: the mutable `<flavor>` tag the consumer pulls is only published
# from the default branch (see the tag list below), so a branch build cannot hand
# the team an unvalidated image.
#
# Deferred on purpose: a weekly `schedule` to pick up base-image/CVE updates.
name: Build turbo-stack CI container

on:
  workflow_dispatch:
    inputs:
      flavor:
        description: Which image to build -- one flavor, or all of them.
        type: choice
        default: all
        options:
          - all
          - gcc-openmpi
          - llvm-openmpi

permissions:
  contents: read
  packages: write

env:
  # Single source of truth for the image ref. Spelled out literally rather than
  # derived from ${{ github.repository }}, which is TURBO-ESM/turbo-stack --
  # GHCR requires an all-lowercase path. The consumer
  # (turbo-cmake-container-tests.yaml) repeats this literal because the `env`
  # context is not available in `jobs.<job_id>.container.image`; keep the two in
  # sync.
  IMAGE: ghcr.io/turbo-esm/turbo-stack/turbo-ci

jobs:
  # Picks the flavors to build. A job of its own because a static matrix cannot
  # be filtered by an input: `matrix` is not available in a job-level `if`, and a
  # matrix `include` entry that matches nothing adds a combination rather than
  # dropping one.
  select:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      include: ${{ steps.pick.outputs.include }}
    steps:
      - name: Pick flavors
        id: pick
        env:
          WANT: ${{ inputs.flavor }}
          # Every flavor this workflow builds.
          #   flavor:           the image tag, <compiler>-<mpi>
          #   compiler/version: the arguments to docker/install_compiler.sh
          FLAVORS: |
            [
              {"flavor": "gcc-openmpi",  "compiler": "gcc",  "compiler_version": ""},
              {"flavor": "llvm-openmpi", "compiler": "llvm", "compiler_version": "21"}
            ]
        run: |
          picked=$(jq -c --arg want "$WANT" \
              '[.[] | select($want == "all" or .flavor == $want)]' <<< "$FLAVORS")
          if [[ "$picked" == "[]" ]]; then
              echo "::error::unknown flavor '$WANT'"
              exit 1
          fi
          echo "include=$picked" >> "$GITHUB_OUTPUT"

  build-and-push:
    name: build+push (${{ matrix.flavor }})
    needs: select
    runs-on: ubuntu-latest
    # A full from-source Spack build is ~1 h; anything past 3 h means a hung
    # fetch or compile, so fail rather than burn the 6 h default.
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.select.outputs.include) }}
    # One build per flavor at a time. Two concurrent dispatches would race to push
    # the same mutable tag and would both export mode=max to the same cache tag.
    # Queue instead of cancel: a nearly-finished 1 h build should not be thrown
    # away by a second dispatch. Different flavors share nothing, so they do not
    # wait on each other.
    concurrency:
      group: turbo-ci-image-${{ matrix.flavor }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        # No submodules: the image build only needs spack/ and docker/ (see
        # .dockerignore).

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          # `<flavor>` (e.g. gcc-openmpi) is the mutable tag the consumer pulls.
          # It is published ONLY from the default branch, so dispatching this
          # workflow against a feature branch validates the recipe (the
          # expensive, likely-to-fail part) without handing the team an
          # unvalidated image.
          # The sha-suffixed tag is always published: it is the immutable ref to
          # point the consumer at when bisecting an image regression.
          tags: |
            type=raw,value=${{ matrix.flavor }},enable={{is_default_branch}}
            type=sha,prefix=${{ matrix.flavor }}-,format=short

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.turbo-ci
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            COMPILER=${{ matrix.compiler }}
            COMPILER_VERSION=${{ matrix.compiler_version }}
          # Registry-backed layer cache stored as a :buildcache-<flavor> tag in
          # GHCR -- one per flavor, because a mode=max export replaces the whole
          # cache tag, so flavors sharing one would evict each other.
          # The GitHub Actions cache backend (type=gha) returns `not_found` on
          # export here and aborts the in-flight image push, so it is unusable.
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache-${{ matrix.flavor }}
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache-${{ matrix.flavor }},mode=max
