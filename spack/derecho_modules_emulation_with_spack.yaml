# derecho_modules_emulation_with_spack.yaml
#
# Temporary spec used to emulate Derecho's module environment on a laptop /
# personal machine.  Provides ONLY the parts that would come from Lmod
# modules on Derecho (compiler, MPI, NetCDF, CMake, build tools) -- FMS,
# pFUnit, AMReX, and TIM are intentionally absent so that
# scripts/build_dependencies_from_source.sh exercises the same from-source path
# that will eventually run on Derecho.
#
# Once scripts/setup_environment/derecho.sh is wired up against real Lmod modules, this file and
# scripts/setup_environment/derecho_modules_emulation_with_spack.sh can be deleted.
spack:
  specs:
    - cmake
    - ninja
    - gmake
    - mpi
    - netcdf-fortran   # pulls in hdf5 + netcdf-c transitively
  view: true
  concretizer:
    unify: true
  packages:
    mpi:
      require: openmpi
